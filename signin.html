<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Removed Netflix favicon -->
    <title>StreamHub Sign In</title>

    <style>
        /* --- GLOBAL STYLES --- */
        body {
            /* Cinematic Background */
            background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1925&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Dark Overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* --- AUTH BOX DESIGN --- */
        .auth-box {
            position: relative;
            background: rgba(22, 22, 22, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            padding: 60px 68px 40px;
            border-radius: 4px;
            width: 450px;
            z-index: 2;
            color: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .auth-box h1 {
            font-size: 2rem;
            margin-bottom: 28px;
            font-weight: 700;
        }

        /* --- INPUTS --- */
        .input-group {
            margin-bottom: 16px;
            position: relative; /* For the eye icon positioning */
        }

        .auth-box input {
            width: 100%;
            padding: 16px 20px;
            background: #333;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 1rem;
            transition: background 0.2s, outline 0.2s;
            box-sizing: border-box;
        }

        .auth-box input:focus {
            outline: none; /* Custom outline logic below */
            background: #454545;
            box-shadow: 0 0 0 2px #e50914;
        }

        /* --- SHOW PASSWORD ICON --- */
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #b3b3b3;
            user-select: none;
            font-size: 1.2rem;
        }
        
        .toggle-password:hover {
            color: white;
        }

        /* --- BUTTON --- */
        .btn-signin {
            width: 100%;
            padding: 16px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 24px;
            transition: background 0.2s, transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 10px rgba(229, 9, 20, 0.3);
        }

        .btn-signin:hover {
            background: #f40612;
        }

        .btn-signin:active {
            transform: translateY(1px);
        }

        .btn-signin:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* --- HELPERS --- */
        .form-help {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #b3b3b3;
        }

        .form-help label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .form-help input[type="checkbox"] {
            width: auto;
            margin: 0;
            padding: 0;
            background: transparent;
        }

        .form-help a {
            color: #b3b3b3;
            text-decoration: none;
        }

        .form-help a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #e87c03;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: none;
            font-weight: bold;
            background: rgba(232, 124, 3, 0.1);
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }

        /* --- FOOTER LINK --- */
        .signup-now {
            margin-top: 40px;
            color: #737373;
            font-size: 1rem;
        }

        .signup-now a {
            color: white;
            text-decoration: none;
        }

        .signup-now a:hover {
            text-decoration: underline;
        }

        /* --- SPINNER --- */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
            display: none; /* Hidden by default */
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <div class="auth-box">
        <h1>Sign In</h1>

        <!-- Error Display -->
        <div id="errorDisplay" class="error-msg"></div>

        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email or phone number" required autocomplete="on">
            </div>
            
            <!-- Added relative wrapper for password input -->
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                <span class="toggle-password" onclick="togglePassword()">👁️</span>
            </div>

            <button type="submit" class="btn-signin" id="submitBtn">
                <span class="spinner" id="btnSpinner"></span>
                <span id="btnText">Sign In</span>
            </button>

            <div class="form-help">
                <label>
                    <input type="checkbox" checked> Remember me
                </label>
                <a href="#">Need help?</a>
            </div>
        </form>

        <div class="signup-now">
            New to StreamHub? <a href="signup.html">Sign up now</a>.
        </div>
    </div>

    <script>
        // 1. CONFIGURATION
        const databaseURL = 'https://69763f18c0c36a2a99509fa2.mockapi.io/users';

        // 2. TOGGLE PASSWORD VISIBILITY
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Simple feedback: change opacity slightly when visible
            const icon = document.querySelector('.toggle-password');
            icon.style.opacity = type === 'text' ? '1' : '0.7';
        }

        // 3. LOGIN LOGIC
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDisplay = document.getElementById('errorDisplay');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            // UI: Set Loading State
            errorDisplay.style.display = 'none';
            submitBtn.disabled = true;
            btnText.textContent = "Signing In...";
            btnSpinner.style.display = "inline-block";
            submitBtn.style.background = "#555"; // Grey out button

            try {
                // --- ADMIN CHECK ---
                // Hardcoded Admin Logic (Matches your admin_panel_mockapi access)
                if (email === "adminUday@netflix.com" && password === "Siva@9948") {
                    window.location.href = 'admin_panel_mockapi.html';
                    return;
                }

                // --- DATABASE CHECK (MockAPI) ---
                const response = await fetch(databaseURL);
                
                if (!response.ok) throw new Error("Network response was not ok");
                
                const users = await response.json();

                // Find user with matching email AND password
                const validUser = users.find(u => u.email === email && u.password === password);

                if (validUser) {
                    // Success: Save to LocalStorage and redirect
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('currentUser', email);
                    // Ideally, check if 'browse.html' exists, otherwise alert success
                    window.location.href = 'browse.html'; 
                } else {
                    // Failure: Invalid Credentials
                    throw new Error("Invalid email or password.");
                }

            } catch (err) {
                // Error Handling UI
                errorDisplay.style.display = 'block';
                errorDisplay.textContent = err.message || "Connection error. Please try again.";
                console.error("Login Error:", err);

                // Reset Button State
                submitBtn.disabled = false;
                btnText.textContent = "Sign In";
                btnSpinner.style.display = "none";
                submitBtn.style.background = "#e50914";
            }
        });
    </script>
</body>

</html>
