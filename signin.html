<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Removed Netflix favicon to stop 'Dangerous Site' warning -->
    <!-- Add your own later: <link rel="icon" href="streamhub-icon.png"> -->
    
    <title>StreamHub Sign In</title>

    <!-- Using the Font from your requested Design -->
    <style>
        /* --- GLOBAL STYLES (From your design reference) --- */
        body {
            background-image: url('https://assets.nflxext.com/ffe/siteui/vlv3/f841d4c7-10e1-40af-bcae-07a3f8dc141a/f6d7434e-d6de-4185-a6d4-c77a2d08737b/US-en-20220502-popsignuptwoweeks-perspective_alpha_website_large.jpg');
            background-size: cover;
            background-position: center;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Dark Overlay (Slightly lighter in the design reference) */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* --- AUTH BOX DESIGN (Applied your requested effects) --- */
        .auth-box {
            position: relative;
            background: rgba(22, 22, 22, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            padding: 60px 68px 40px;
            border-radius: 4px;
            width: 450px;
            z-index: 2;
            color: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .auth-box h1 {
            font-size: 2rem;
            margin-bottom: 28px;
            font-weight: 700;
        }

        /* --- INPUTS (From your design reference) --- */
        .input-group {
            margin-bottom: 16px;
        }

        .auth-box input {
            width: 100%;
            padding: 16px 20px;
            background: #333;
            /* Dark grey input background */
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 1rem;
            transition: background 0.2s;
            box-sizing: border-box;
            /* Ensures padding doesn't affect width */
        }

        .auth-box input:focus {
            outline: 2px solid #e50914;
            /* Red outline on focus */
            background: #454545;
        }

        /* --- BUTTON (Solid Red, Bold text) --- */
        .btn-signin {
            width: 100%;
            padding: 16px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 24px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(229, 9, 20, 0.3);
        }

        .btn-signin:hover {
            background: #f40612;
            transform: translateY(-1px);
        }

        .btn-signin:active {
            transform: translateY(1px);
        }

        /* --- HELPERS (Remember me / Need help) --- */
        .form-help {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #b3b3b3;
        }

        .form-help label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .form-help input[type="checkbox"] {
            width: auto;
            margin: 0;
            padding: 0;
        }

        .form-help a {
            color: #b3b3b3;
            text-decoration: none;
        }

        .form-help a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #e87c03;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: none;
            font-weight: bold;
        }

        /* --- FOOTER LINK --- */
        .signup-now {
            margin-top: 40px;
            color: #737373;
            font-size: 1rem;
        }

        .signup-now a {
            color: white;
            text-decoration: none;
        }

        .signup-now a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="auth-box">
        <h1>Sign In</h1>

        <!-- Error Display -->
        <div id="errorDisplay" class="error-msg"></div>

        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email or phone number" required autocomplete="on">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-signin">Sign In</button>

            <div class="form-help">
                <label>
                    <input type="checkbox" checked> Remember me
                </label>
                <a href="#">Need help?</a>
            </div>
        </form>

        <!-- Updated Text for StreamHub -->
        <div class="signup-now">
            New to StreamHub? <a href="signup.html">Sign up now</a>.
        </div>
    </div>

    <script>
        // Database URL kept exactly the same as your original code
        const databaseURL = 'https://69763f18c0c36a2a99509fa2.mockapi.io/users';

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDisplay = document.getElementById('errorDisplay');

            // Hide previous errors
            errorDisplay.style.display = 'none';

            try {
                // 1. ADMIN CHECK (Kept your original credentials exactly)
                if (email === "adminUday@netflix.com" && password === "Siva@9948") {
                    window.location.href = 'admin_panel_mockapi.html';
                    return;
                }

                // 2. DATABASE CHECK (MockAPI)
                const response = await fetch(databaseURL);
                const users = await response.json();

                const validUser = users.find(u => u.email === email && u.password === password);

                if (validUser) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('currentUser', email);
                    window.location.href = 'browse.html';
                } else {
                    // Show error message in the UI instead of native alert
                    errorDisplay.style.display = 'block';
                    errorDisplay.textContent = "Invalid email or password.";
                }
            } catch (err) {
                errorDisplay.style.display = 'block';
                errorDisplay.textContent = "Connection error. Please try again.";
                console.error("Error:", err);
            }
        });
    </script>
</body>

</html>
